version: '3.8'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: moodfeed
      POSTGRES_USER: moodfeed
      POSTGRES_PASSWORD: moodfeed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://moodfeed:moodfeed@db:5432/moodfeed
    depends_on:
      - db
volumes:
  postgres_data:
